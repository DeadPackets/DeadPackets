<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Sticker stories</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/archivo-latin-ad60be.woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<style>
:root { --bg: oklch(10% 0.008 257); --panel: oklch(15% 0.015 256); --ink: oklch(96% 0.006 255); --muted: oklch(77% 0.018 255); --line: oklch(33% 0.025 255); --eng: oklch(80% 0.12 205); --acc: oklch(74% 0.16 35); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 Archivo, system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: oklch(10% 0.008 257 / 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font-size: 20px; margin: 0; }
.count { font: 600 13px 'JetBrains Mono', monospace; color: var(--eng); }
header .sp { flex: 1; }
button, .file { font: 600 14px Archivo; color: var(--ink); background: oklch(100% 0 0 / 0.07); border: 1px solid oklch(100% 0 0 / 0.14); border-radius: 9px; padding: 9px 14px; min-height: 40px; cursor: pointer; }
button.primary { background: var(--acc); color: oklch(18% 0.03 35); border-color: transparent; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; }
.intro { color: var(--muted); max-width: 70ch; margin: 6px 0 22px; }
.filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.filter input[type=search] { flex: 1; min-width: 200px; }
h2 { font-size: 18px; margin: 28px 0 12px; color: var(--muted); }
article { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
article.done { border-color: oklch(80% 0.12 205 / 0.5); }
article img { width: 120px; height: 120px; object-fit: contain; background: oklch(26% 0.03 256); border-radius: 10px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.fields .wide { grid-column: 1 / -1; }
label { display: grid; gap: 4px; font: 600 13px Archivo; color: var(--muted); }
input, textarea { font: 400 15px Archivo; color: var(--ink); background: oklch(15% 0.02 258); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--eng); outline-offset: 2px; }
.id { font: 400 12px 'JetBrains Mono', monospace; color: var(--muted); }
@media (max-width: 640px) { article { grid-template-columns: 1fr; } article img { width: 96px; height: 96px; } .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Sticker stories</h1><span class="count" aria-live="polite"></span><span class="sp"></span>
  <label class="file">Import JSON<input type="file" accept="application/json,.json"></label>
  <button type="button" class="copy">Copy JSON</button>
  <button type="button" class="primary dl">Download stories.json</button>
</header>
<main>
  <p class="intro">Write each sticker's story in your own words. Everything saves in this browser as you type. When you are done, download <b>stories.json</b> and send it over: the site shows it when someone clicks a sticker. Leave a field empty to skip it.</p>
  <div class="filter"><input type="search" placeholder="Filter by name" aria-label="Filter stickers by name"><button type="button" class="todo" aria-pressed="false">Only unwritten</button></div>
  <div class="list"></div>
</main>
<script type="module">
const KEY = 'sticker-stories-v1', LAPTOP = { old: 'HUAWEI MateBook D16', new: 'MacBook Pro 16' };
const all = await (await fetch('stickers.json')).json();
let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
if (!Object.keys(data).length) data = await fetch('stories.json').then((r) => r.json()).catch(() => ({}));
const list = document.querySelector('.list'), count = document.querySelector('.count'), total = all.old.stickers.length + all.new.stickers.length;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const F = [['title', 'Title', 'input', ''], ['where', 'Where and when you got it', 'input', 'e.g. DEF CON 33, Las Vegas, 2025'], ['story', 'The story, in your words', 'textarea', 'What it means, who gave it to you, anything'], ['link', 'Link (optional)', 'input', 'https://']];
list.innerHTML = ['old', 'new'].map((k) => `<h2>${LAPTOP[k]}</h2>` + [...all[k].stickers].sort((a, b) => b.z - a.z).map((e) => {
  const id = `${k}:${e.id}`, d = data[id] || {};
  return `<article data-id="${id}" data-name="${esc(e.name.toLowerCase())}"><img src="${e.file.replace('stickers/', 'stickers/m/')}" alt="${esc(e.name)}" loading="lazy" width="120" height="120">
    <div class="fields">${F.map(([f, l, t, ph]) => `<label class="${f === 'story' ? 'wide' : ''}">${l}${t === 'textarea' ? `<textarea name="${f}" placeholder="${esc(ph)}">${esc(d[f])}</textarea>` : `<input name="${f}" ${f === 'link' ? 'type="url"' : ''} value="${esc(d[f] ?? (f === 'title' ? e.name : ''))}" placeholder="${esc(ph)}">`}</label>`).join('')}
    <p class="id wide">${id}</p></div></article>`;
}).join('')).join('');
const clean = () => { const o = {}; for (const [id, d] of Object.entries(data)) { const v = Object.fromEntries(Object.entries(d).filter(([, x]) => String(x).trim())); if (v.story || v.where || v.link || (v.title && v.title !== v._name)) { delete v._name; o[id] = v; } } return o; };
function refresh() {
  let n = 0; for (const a of list.querySelectorAll('article')) { const ok = !!(data[a.dataset.id]?.story || '').trim(); a.classList.toggle('done', ok); n += ok; }
  count.textContent = `${n} of ${total} written`;
}
list.addEventListener('input', (ev) => {
  const a = ev.target.closest('article'), id = a.dataset.id; data[id] = data[id] || {};
  data[id][ev.target.name] = ev.target.value; data[id]._name = a.querySelector('img').alt;
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  refresh();
});
const json = () => JSON.stringify(clean(), null, 1);
document.querySelector('.dl').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json()], { type: 'application/json' })); a.download = 'stories.json'; a.click(); });
document.querySelector('.copy').addEventListener('click', async (ev) => { await navigator.clipboard.writeText(json()); ev.target.textContent = 'Copied'; setTimeout(() => (ev.target.textContent = 'Copy JSON'), 1500); });
document.querySelector('.file input').addEventListener('change', async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try { data = { ...data, ...JSON.parse(await f.text()) }; localStorage.setItem(KEY, JSON.stringify(data)); location.reload(); } catch { alert('That file is not valid JSON.'); }
});
const q = document.querySelector('[type=search]'), todo = document.querySelector('.todo');
const filt = () => { for (const a of list.querySelectorAll('article')) a.hidden = (q.value && !a.dataset.name.includes(q.value.toLowerCase())) || (todo.getAttribute('aria-pressed') === 'true' && a.classList.contains('done')); };
q.addEventListener('input', filt); todo.addEventListener('click', () => { todo.setAttribute('aria-pressed', todo.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); filt(); });
refresh();
</script>
</body>
</html>
